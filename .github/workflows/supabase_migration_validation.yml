name: Validate Supabase migrations

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase_migration_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-replay:
    name: Replay migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start isolated local Supabase
        run: supabase start

      - name: Replay all migrations from scratch
        run: supabase db reset --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
