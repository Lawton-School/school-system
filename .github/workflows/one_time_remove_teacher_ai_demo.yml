name: One-time remove Teacher AI demo name

on:
  push:
    branches:
      - chatgpt/phase3-contracts
    paths:
      - '.github/workflows/one_time_remove_teacher_ai_demo.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase3-contracts
      - name: Remove hardcoded student name and self-delete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('my_flutter_app/lib/screens/teacher/teacher_ai_assistant_screen.dart')
          text = path.read_text()
          old = "final TextEditingController _studentNameCtrl = TextEditingController(text: 'Tariro Moyo');"
          new = "final TextEditingController _studentNameCtrl = TextEditingController();"
          if old not in text:
              raise SystemExit('Expected Teacher AI demo initializer was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one_time_remove_teacher_ai_demo.yml
          git config user.name 'Lawton-School'
          git config user.email 'school@lawton.co.za'
          git add my_flutter_app/lib/screens/teacher/teacher_ai_assistant_screen.dart .github/workflows/one_time_remove_teacher_ai_demo.yml
          git commit -m 'Remove Teacher AI hardcoded student name'
          git push origin HEAD:chatgpt/phase3-contracts
