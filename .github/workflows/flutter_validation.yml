name: Validate Flutter app

on:
  pull_request:
    paths:
      - 'my_flutter_app/**'
      - '.github/workflows/flutter_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    name: Analyze test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: my_flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Security scan client source
        run: |
          set -e
          if grep -R -n -E 'openrouter\.ai|OPENROUTER_API_KEY|openRouterApiKey|SUPABASE_SERVICE_ROLE|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' lib; then
            echo 'High-risk server credential/provider reference found in Flutter client source.' >&2
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/school-system/"
