name: Phase 4 normalize Parent Dashboard contract

on:
  push:
    branches:
      - chatgpt/phase3-contracts
    paths:
      - '.github/workflows/phase4_fix_parent_dashboard_contract.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase3-contracts
          fetch-depth: 0

      - name: Normalize verified Parent Dashboard RPC shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('my_flutter_app/lib/models/models.dart')
          s = p.read_text()

          pattern = re.compile(
              r"  factory ParentDashboardData\.fromMap\(.*?\n  \}\n\}\n\nclass DirectMessageItem",
              re.S,
          )

          replacement = r'''  factory ParentDashboardData.fromMap(
    String studentId,
    String studentName,
    String className,
    Map<String, dynamic> map,
  ) {
    Map<String, dynamic> objectMap(dynamic value) => value is Map
        ? Map<String, dynamic>.from(value)
        : const <String, dynamic>{};

    final dashboard = objectMap(map['dashboard']);
    final attendance = objectMap(map['attendance']);
    final academics = objectMap(map['academics']);
    final finance = objectMap(map['finance']);
    final enrollment = objectMap(map['enrollment']);
    final student = objectMap(map['student']);

    final currencyList = <FinanceCurrencySummary>[];
    final byCurrency = finance['by_currency'];
    if (byCurrency is List) {
      for (final item in byCurrency) {
        if (item is Map) {
          currencyList.add(
            FinanceCurrencySummary.fromMap(Map<String, dynamic>.from(item)),
          );
        }
      }
    }

    final resolvedStudentName = [student['first_name'], student['last_name']]
        .whereType<String>()
        .where((part) => part.trim().isNotEmpty)
        .join(' ');

    final resolvedClassName = [
      enrollment['class_name'],
      enrollment['section_name'],
    ]
        .whereType<String>()
        .where((part) => part.trim().isNotEmpty)
        .join(' · ');

    final attendanceRate = (attendance['attendance_rate'] as num?)?.toDouble();
    final recordedDays = (attendance['recorded_days'] as num?)?.toInt() ?? 0;
    final academicAverage = (dashboard['current_average'] as num?)?.toDouble();
    final currentGrade = dashboard['current_grade']?.toString();
    final assignmentsDue = (dashboard['assignments_due'] as num?)?.toInt() ?? 0;
    final assignmentsOverdue =
        (dashboard['assignments_overdue'] as num?)?.toInt() ?? 0;

    String? nextLesson;
    final nextLessonMap = objectMap(dashboard['next_lesson']);
    if (nextLessonMap.isNotEmpty) {
      final parts = <String>[
        if ((nextLessonMap['subject']?.toString() ?? '').isNotEmpty)
          nextLessonMap['subject'].toString(),
        if ((nextLessonMap['start_time']?.toString() ?? '').isNotEmpty)
          nextLessonMap['start_time'].toString(),
        if ((nextLessonMap['teacher_name']?.toString() ?? '').isNotEmpty)
          nextLessonMap['teacher_name'].toString(),
      ];
      if (parts.isNotEmpty) nextLesson = parts.join(' · ');
    }

    String? latestResult;
    final latestResultMap = objectMap(dashboard['latest_result']);
    if (latestResultMap.isNotEmpty) {
      final parts = <String>[
        if ((latestResultMap['subject']?.toString() ?? '').isNotEmpty)
          latestResultMap['subject'].toString(),
        if ((latestResultMap['assessment_title']?.toString() ?? '').isNotEmpty)
          latestResultMap['assessment_title'].toString(),
        if (latestResultMap['percentage'] != null)
          '${latestResultMap['percentage']}%',
      ];
      if (parts.isNotEmpty) latestResult = parts.join(' · ');
    }

    String? nextFeeDate;
    final nextFeeMap = objectMap(dashboard['next_fee']);
    if (nextFeeMap.isNotEmpty) {
      final dueDate = nextFeeMap['due_date']?.toString();
      final currency = nextFeeMap['currency']?.toString();
      final balance = nextFeeMap['balance'];
      final parts = <String>[
        if (currency != null && currency.isNotEmpty && balance != null)
          '$currency $balance',
        if (dueDate != null && dueDate.isNotEmpty) 'Due $dueDate',
      ];
      if (parts.isNotEmpty) nextFeeDate = parts.join(' · ');
    }

    final recentActivity = <ParentActivityItem>[];
    final recentGrades = academics['recent_grades'];
    if (recentGrades is List) {
      for (final raw in recentGrades.take(5)) {
        if (raw is! Map) continue;
        final grade = Map<String, dynamic>.from(raw);
        final metaParts = <String>[
          if ((grade['subject']?.toString() ?? '').isNotEmpty)
            grade['subject'].toString(),
          if (grade['percentage'] != null) '${grade['percentage']}%',
        ];
        recentActivity.add(
          ParentActivityItem(
            title: grade['assessment_title']?.toString() ?? 'Assessment',
            meta: metaParts.join(' · '),
            badge: 'Grade',
            variant: 'success',
          ),
        );
      }
    }

    final announcements = <Map<String, dynamic>>[];
    final latestAnnouncement = objectMap(dashboard['latest_announcement']);
    if (latestAnnouncement.isNotEmpty) {
      announcements.add(latestAnnouncement);
    }

    return ParentDashboardData(
      studentId: studentId,
      studentName:
          resolvedStudentName.isNotEmpty ? resolvedStudentName : studentName,
      className: resolvedClassName.isNotEmpty ? resolvedClassName : className,
      attendanceRate: attendanceRate,
      attendanceHint: recordedDays > 0
          ? '$recordedDays recorded attendance days'
          : 'No attendance recorded',
      academicAverage: academicAverage,
      academicHint: currentGrade != null && currentGrade.isNotEmpty
          ? 'Current grade: $currentGrade'
          : 'No published academic average',
      currencySummaries: currencyList,
      assignmentsDueCount: assignmentsDue,
      assignmentsHint: '$assignmentsOverdue overdue',
      nextLesson: nextLesson,
      latestResult: latestResult,
      nextFeeDate: nextFeeDate,
      recentActivity: recentActivity,
      announcements: announcements,
    );
  }
}

class DirectMessageItem'''

          updated, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one ParentDashboardData.fromMap block, found {count}')
          p.write_text(updated)
          PY

      - name: Commit normalization
        run: |
          git config user.name "ZivoConnect CI"
          git config user.email "actions@users.noreply.github.com"
          git add my_flutter_app/lib/models/models.dart
          git diff --cached --quiet && exit 0
          git commit -m "Normalize Parent Dashboard RPC contract"
          git push origin HEAD:chatgpt/phase3-contracts
