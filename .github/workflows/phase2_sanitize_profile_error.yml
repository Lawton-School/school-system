name: Phase 2 sanitize profile error

on:
  push:
    branches:
      - chatgpt/phase2-security
    paths:
      - '.github/workflows/phase2_sanitize_profile_error.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase2-security
      - name: Remove internal exception text from profile error UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('my_flutter_app/lib/screens/auth/profile_picker_screen.dart')
          s = p.read_text()
          old = "'Could not switch profile. Please try again. ${e.toString()}',"
          new = "'Could not switch profile. Please try again.',"
          if old not in s:
              raise SystemExit('Expected profile error text not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit
        run: |
          git config user.name "ZivoConnect CI"
          git config user.email "actions@users.noreply.github.com"
          git add my_flutter_app/lib/screens/auth/profile_picker_screen.dart
          git commit -m "Sanitize profile switch error message"
          git push origin HEAD:chatgpt/phase2-security
