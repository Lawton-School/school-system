name: Phase 2 fix unused catch

on:
  push:
    branches:
      - chatgpt/phase2-security
    paths:
      - '.github/workflows/phase2_fix_unused_catch.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase2-security
      - name: Replace unused profile switch exception variable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('my_flutter_app/lib/screens/auth/profile_picker_screen.dart')
          s = p.read_text()
          old = '} catch (e) {'
          if old not in s:
              raise SystemExit('Expected catch clause not found')
          p.write_text(s.replace(old, '} catch (_) {', 1))
          PY
      - name: Commit
        run: |
          git config user.name "ZivoConnect CI"
          git config user.email "actions@users.noreply.github.com"
          git add my_flutter_app/lib/screens/auth/profile_picker_screen.dart
          git commit -m "Remove unused profile switch exception variable"
          git push origin HEAD:chatgpt/phase2-security
